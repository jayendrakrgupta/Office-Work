<html>
    <head>
        <title>BMI Index Calculator</title>
       
    </head>
    <body>
        <h1>BMI Index Calculator</h1>
        <form id="bmiForm">
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" name="weight" required>
            <br>
            <label for="height">Height (m):</label>
            <input type="number" id="height" name="height" step="0.01" required>
            <br>
            <input type="submit" value="Calculate BMI">
            <p id="result" style="border:2px solid #9a1010; width:fit-content; padding: 10px; margin-top: 10px; color:gray;">This is where the result will be displayed.</p>
        </form>
        
    </body>
     <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                /* background-color: #333; */
            }
            h1 {
                color: #bcbcbc;
            }
            form {
                margin-top: 20px;
                color: #ffffff;
            }
            label {
                display: block;
                margin-bottom: 10px;
            }
            input[type="number"] {
                width: 100px;
                padding: 5px;
                margin-bottom: 10px;
            }
            input[type="submit"] {
                padding: 5px 10px;
            }   
            </style>
    <script src="bmiindexcalc.js"></script>
</html>
